<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="careflowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="ecgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <rect x="12" y="12" width="136" height="136" rx="36" fill="url(#glowGrad)" />

  <!-- Outer Glass Frame -->
  <rect x="16" y="16" width="128" height="128" rx="32" fill="#0f172a" fill-opacity="0.82" stroke="url(#careflowGrad)" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Medical Cross Subtle Background -->
  <path d="M72 40h16v16h16v16h-16v16H72V72H56V56h16V40z" fill="#06b6d4" fill-opacity="0.08" />

  <!-- ECG Vital-Sign Rhythm Trace with Glow -->
  <path d="M28 84h26l8-18 10 34 12-42 10 30 7-12 5 8h26"
        stroke="#38bdf8"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#ecgGlow)"
        opacity="0.4" />

  <!-- Main Crisp ECG Rhythm Trace -->
  <path d="M28 84h26l8-18 10 34 12-42 10 30 7-12 5 8h26"
        stroke="url(#careflowGrad)"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Vital Pulse Indicator Dot -->
  <circle cx="132" cy="84" r="4.5" fill="#22d3ee" filter="url(#ecgGlow)" />
  <circle cx="132" cy="84" r="2.5" fill="#ffffff" />
</svg>
