    <!-- Instant Global Theme Initialization (prevents flash on reload) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('careflow_landing_theme') || localStorage.getItem('careflow_theme');
          if (saved === 'white' || saved === 'black') {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            document.documentElement.setAttribute('data-theme', 'default');
          }
        } catch (e) {}
      })();
