      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/receptionist-stats/:
    get:
      operationId: appointments_receptionist_stats_retrieve
      description: |-
        Real-time backend statistics for the Receptionist Overview dashboard:
        - Today's Appointments
        - Upcoming Appointments
        - Registered Patients
        - Checked-in Patients Today
        - Patients Waiting Today
        - Completed Today
        - Cancelled Today
      tags:
      - appointments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Changes password for current user after verifying their current
        password.
      summary: Change user password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/email-status/:
    get:
      operationId: auth_email_status_retrieve
      description: Verifies whether real SMTP credentials are set in the backend environment.
      summary: Check SMTP email service configuration
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: Generates a 24-hour reset token and emails a direct link to the
        user's registered email.
      summary: Request password reset link
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Validates the token from the email link and resets the account
        password.
      summary: Confirm password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Returns username, email, full name, role, and phone number for
        current user.
      summary: Get authenticated user profile
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: auth_profile_partial_update
      description: Updates first name, last name, email, and phone number for current
        user.
      summary: Update authenticated user profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Creates an unverified patient account and sends a real 6-digit
        OTP to their email address.
      summary: Register user & send OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          description: User created and OTP dispatched
        '400':
          description: Validation error
  /api/auth/resend-otp/:
    post:
      operationId: auth_resend_otp_create
      description: Sends a fresh 6-digit OTP code to the specified email address with
        a 45-second rate limiter.
      summary: Resend verification OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendOTP'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: New OTP generated and sent
        '400':
          description: Rate limited or validation error
  /api/auth/test-email/:
    post:
      operationId: auth_test_email_create
      description: Tests real SMTP sending to verify email delivery from backend.
      summary: Send test verification email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TestEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TestEmail'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '502':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
  /api/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      description: Verifies the 6-digit OTP code, marks email verified, activates
        user, and returns JWT tokens.
      summary: Verify email OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: OTP verified successfully, JWT tokens issued
        '400':
          description: Invalid or expired OTP
  /api/billing/invoices/:
    get:
      operationId: billing_invoices_list
      description: |-
        CareFlow HMS Billing & Financial Invoices.
        - Receptionist & Pharmacist: Create and manage outpatient invoices.
        - Patient: View only their own bills and balances.
        - Doctor: View bills associated with their consultations.
        - Admin: Oversight and administrative auditing.
        - Completely excludes bed/ward/inpatient charges.
      summary: List patient bills and invoices
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - PAID
          - PARTIALLY_PAID
          - UNPAID
        description: |-
          * `UNPAID` - Unpaid
          * `PARTIALLY_PAID` - Partially Paid
          * `PAID` - Fully Paid
          * `CANCELLED` - Cancelled
      tags:
      - billing
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillList'
          description: ''
    post:
      operationId: billing_invoices_create
      description: |-
        CareFlow HMS Billing & Financial Invoices.
        - Receptionist & Pharmacist: Create and manage outpatient invoices.
        - Patient: View only their own bills and balances.
        - Doctor: View bills associated with their consultations.
        - Admin: Oversight and administrative auditing.
        - Completely excludes bed/ward/inpatient charges.
      summary: Create patient bill (Receptionist, Pharmacist, Admin)
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bill'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Bill'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Bill'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
  /api/billing/invoices/{id}/:
    get:
      operationId: billing_invoices_retrieve
      description: |-
        CareFlow HMS Billing & Financial Invoices.
        - Receptionist & Pharmacist: Create and manage outpatient invoices.
        - Patient: View only their own bills and balances.
        - Doctor: View bills associated with their consultations.
        - Admin: Oversight and administrative auditing.
        - Completely excludes bed/ward/inpatient charges.
      summary: Retrieve invoice details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bill.
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
    put:
      operationId: billing_invoices_update
      description: |-
        CareFlow HMS Billing & Financial Invoices.
        - Receptionist & Pharmacist: Create and manage outpatient invoices.
        - Patient: View only their own bills and balances.
        - Doctor: View bills associated with their consultations.
        - Admin: Oversight and administrative auditing.
        - Completely excludes bed/ward/inpatient charges.
      summary: Update invoice
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bill.
        required: true
