components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        appointment_id:
          type: string
          readOnly: true
          description: Unique Appointment Identifier (e.g., CF-APT-10001)
        patient:
          type: integer
        patient_name:
          type: string
          readOnly: true
        patient_id_code:
          type: string
          readOnly: true
        doctor:
          type: integer
        doctor_name:
          type: string
          readOnly: true
        doctor_department:
          type: string
          readOnly: true
        doctor_specialization:
          type: string
          readOnly: true
        consultation_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          format: time
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          default: SCHEDULED
        is_checked_in:
          type: boolean
          description: Designates whether the patient has arrived and checked in at
            the front desk.
        check_in_time:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the patient was checked in by the receptionist.
        cancellation_reason:
          type: string
          nullable: true
          description: Reason recorded upon cancellation of the appointment.
        reason_for_visit:
          type: string
          description: Primary complaint or purpose of consultation.
        authorized_notes:
          type: string
          nullable: true
          description: Clinical consultation notes recorded by authorized medical
            personnel.
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - appointment_date
