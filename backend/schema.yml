openapi: 3.0.3
info:
  title: CareFlow-HMS API
  version: 1.0.0
  description: CareFlow Hospital Management System REST API documentation
paths:
  /api/appointments/:
    get:
      operationId: appointments_list
      description: |-
        CareFlow HMS Appointment Lifecycle.
        Enforces role-based permissions:
        - Receptionist: Full appointment scheduling and management.
        - Doctor: View their appointments; record clinical notes; mark completed.
        - Patient: View their appointments; book appointments; cancel scheduled slots. Cannot modify notes or status.
        - Admin: Oversight and administrative auditing.
      summary: List appointments
      parameters:
      - in: query
        name: appointment_date
        schema:
          type: string
          format: date
      - in: query
        name: doctor
        schema:
          type: integer
      - in: query
        name: is_checked_in
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - COMPLETED
          - CONFIRMED
          - IN_PROGRESS
          - NO_SHOW
          - SCHEDULED
        description: |-
          * `SCHEDULED` - Scheduled
          * `CONFIRMED` - Confirmed
          * `IN_PROGRESS` - In Progress
          * `COMPLETED` - Completed
          * `CANCELLED` - Cancelled
          * `NO_SHOW` - No Show
      tags:
      - appointments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
    post:
      operationId: appointments_create
      description: |-
        CareFlow HMS Appointment Lifecycle.
        Enforces role-based permissions:
        - Receptionist: Full appointment scheduling and management.
        - Doctor: View their appointments; record clinical notes; mark completed.
        - Patient: View their appointments; book appointments; cancel scheduled slots. Cannot modify notes or status.
        - Admin: Oversight and administrative auditing.
      summary: Schedule appointment (Receptionist or Patient)
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Appointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Appointment'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/:
    get:
      operationId: appointments_retrieve
      description: |-
        CareFlow HMS Appointment Lifecycle.
        Enforces role-based permissions:
        - Receptionist: Full appointment scheduling and management.
        - Doctor: View their appointments; record clinical notes; mark completed.
        - Patient: View their appointments; book appointments; cancel scheduled slots. Cannot modify notes or status.
        - Admin: Oversight and administrative auditing.
      summary: Retrieve specific appointment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    put:
      operationId: appointments_update
      description: |-
        CareFlow HMS Appointment Lifecycle.
        Enforces role-based permissions:
        - Receptionist: Full appointment scheduling and management.
        - Doctor: View their appointments; record clinical notes; mark completed.
        - Patient: View their appointments; book appointments; cancel scheduled slots. Cannot modify notes or status.
        - Admin: Oversight and administrative auditing.
      summary: Update appointment details or status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Appointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Appointment'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    patch:
      operationId: appointments_partial_update
      description: |-
        CareFlow HMS Appointment Lifecycle.
        Enforces role-based permissions:
        - Receptionist: Full appointment scheduling and management.
        - Doctor: View their appointments; record clinical notes; mark completed.
        - Patient: View their appointments; book appointments; cancel scheduled slots. Cannot modify notes or status.
        - Admin: Oversight and administrative auditing.
      summary: Partial update appointment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointment'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    delete:
      operationId: appointments_destroy
      description: |-
        CareFlow HMS Appointment Lifecycle.
        Enforces role-based permissions:
        - Receptionist: Full appointment scheduling and management.
        - Doctor: View their appointments; record clinical notes; mark completed.
        - Patient: View their appointments; book appointments; cancel scheduled slots. Cannot modify notes or status.
        - Admin: Oversight and administrative auditing.
      summary: Cancel appointment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/appointments/{id}/cancel-appointment/:
    post:
      operationId: appointments_cancel_appointment_create
      description: |-
        Cancels appointment with confirmation and records cancellation reason.
        Preserves appointment record instead of permanently deleting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Appointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Appointment'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/check-in/:
    post:
      operationId: appointments_check_in_create
      description: |-
        Check in patient upon arrival at the hospital front desk.
        Enforces:
        - Only Receptionist or Admin can check in patients.
        - Appointment must not be cancelled, completed, or no-show.
        - Prevents duplicate check-in.
        - Records exact check_in_time and transitions SCHEDULED to CONFIRMED.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Appointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Appointment'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/undo-check-in/:
    post:
      operationId: appointments_undo_check_in_create
      description: Reverts an accidental check-in.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Appointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Appointment'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/available-slots/:
    get:
      operationId: appointments_available_slots_retrieve
      description: |-
        CareFlow HMS Appointment Lifecycle.
        Enforces role-based permissions:
        - Receptionist: Full appointment scheduling and management.
        - Doctor: View their appointments; record clinical notes; mark completed.
        - Patient: View their appointments; book appointments; cancel scheduled slots. Cannot modify notes or status.
        - Admin: Oversight and administrative auditing.
      tags:
